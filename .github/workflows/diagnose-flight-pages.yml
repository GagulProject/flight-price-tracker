name: Collect and verify flight prices
# Manual refresh requested 2026-10-17 22:50 KST
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: flight-price-collection
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests and data validation
        run: npm test && npm run check
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Collect exact itinerary prices
        id: collection
        continue-on-error: true
        env:
          SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
        run: node scripts/diagnose-flight-pages.mjs
      - name: Validate preserved and collected data
        run: npm run check
      - name: Persist attempts and preserve price history
        run: node scripts/persist-results.mjs
      - name: Prepare Pages files
        run: |
          mkdir -p public/data
          cp index.html app.js styles.css .nojekyll public/
          cp data/prices.json data/diagnostics.json public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy updated status and prices
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages in Chromium
        run: node scripts/verify-pages.mjs
      - name: Collection summary
        if: always()
        run: |
          node -e 'const fs=require("fs"); const p="diagnostics/collection-summary.json"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Flight collection\n"+(fs.existsSync(p)?fs.readFileSync(p,"utf8"):"Collection did not complete")+"\nAlert integration: no existing sender was found in this repository. No unverified or historical-price alert is sent.\n")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-search-diagnostics
          path: diagnostics/
          retention-days: 7
      - name: Require at least one verified live quote
        if: steps.collection.outcome != 'success'
        run: |
          echo "No verified live quote collected. Preserved historical prices are not collection success."
          exit 1

