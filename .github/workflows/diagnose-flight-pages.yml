name: Diagnose flight search loading
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-flight-pages.mjs'
      - '.github/workflows/diagnose-flight-pages.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-flight-pages.mjs
      - name: Persist diagnostic results to repository
        if: always()
        run: |
          if [ -f diagnostics/results.json ]; then
            mkdir -p data
            cp diagnostics/results.json data/diagnostics.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/diagnostics.json
            if ! git diff --cached --quiet; then
              git commit -m "Record flight search diagnostics [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-search-diagnostics
          path: diagnostics/
          retention-days: 7
